services:
  # Development service with HTTPS support
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "3001:3001"  # HTTPS port
    volumes:
      - .:/app
      - /app/node_modules
      - ./certs:/app/certs:ro  # Mount certificates directory
    environment:
      - NODE_ENV=development
    command: npm run dev:https
    networks:
      - night-sky-network

  # Development service with HTTP (fallback)
  dev-http:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - night-sky-network

  # HTTPS Proxy service for development
  dev-https-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx-dev-https.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl:ro
    depends_on:
      - dev-http
    networks:
      - night-sky-network

  # Production service
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - night-sky-network

  # Production service with HTTPS
  prod-https:
    build:
      context: .
      dockerfile: Dockerfile.prod-https
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/ssl:ro
    networks:
      - night-sky-network

  # Test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run type-check
    networks:
      - night-sky-network

  # Linting service
  lint:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run lint
    networks:
      - night-sky-network

networks:
  night-sky-network:
    driver: bridge